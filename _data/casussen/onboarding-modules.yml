# Casus 4 — Onboarding in losse modules. Inhoud voor _includes/varianten/pagina-d.html.
# Bron: _marketing/casus-4-onboarding-modules.md en het plan van aanpak (kop op het
# beleid, niet op onboarding; implementatiepartner; naast het leerplatform).
# Persona-review: _marketing/reviews/persona-review-onboarding-modules.md.
# Claimgrens: geen AI Act-claim (niet "verplicht", niet "vervallen"); bij cyber de
# zorgplicht benoemen maar geen compliance beloven; we ontwerpen hun onboarding niet;
# geen prijzen. Het dilemma in het probeerblok is een voorbeeld, geen bestaande module.

hero:
  titel: "Er is een AI-beleid. Niemand weet wat erin staat."
  lead: "Wij maken jullie beleid speelbaar, in korte modules voor de situaties die alleen bij jullie voorkomen. Voor nieuwe en huidige medewerkers, naast het leerplatform dat er al is."
  knop: "Probeer één situatie"
  beeld:
    src: /assets/images/verhalen/maria-strip-macbooks.jpg
    alt: "Stripbeeld uit Het verhaal van Maria: collega's achter hun laptops op een rustige ochtend"
    caption: "Voorbeeld uit ons werk: Het verhaal van Maria, voor onITnow. Maria werkt op de servicedesk van een gemeente."

rollen:
  - pad: hr
    sectie: voor-hr
    label: "Ik zit bij HR of L&D"
    sub: "Je moet het beleid laten landen"
    reactie: "Jij moet het beleid laten landen. Hieronder: wat er nu ontbreekt, en hoe een module past."
    kaart: { src: /assets/images/verhalen/maria-strip-service.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/maria-storytelling.jpg, alt: "Beeld uit Het verhaal van Maria" }
    titel: "Het beleid loopt achter op wat mensen nu doen"
    alineas:
      - "Twee derde van het grootbedrijf gebruikt AI. Van de mensen die het op hun werk gebruiken, kreeg minder dan een derde er instructie bij (CBS, 2025; Newcom AI-Monitor, juli 2026). Het beleid staat op intranet; wat het betekent op een dinsdagochtend, weet bijna niemand."
      - "Wij maken modules voor de situaties die alleen bij jullie voorkomen. Losse modules, apart toe te wijzen en apart bij te werken, naast het leerplatform dat er al is."
    vraag:
      id: ai-beleid
      vraag: "Hebben jullie al een AI-beleid?"
      veld: "AI-beleid"
      antwoorden:
        - waarde: ja
          label: "Ja, het staat op papier"
          sub: "Op intranet of in het personeelshandboek"
          kop: "Het staat er. Weten mensen wat het betekent?"
          reactie: "Dat merk je pas als iemand een AI-tool opent. Hieronder kies je zelf in zo'n situatie."
          stap: { label: "Probeer één situatie", href: "#probeer" }
          formulier: "Vertel sinds wanneer het beleid er is en voor wie het geldt."
        - waarde: bezig
          label: "We zijn ermee bezig"
          sub: "Er ligt een concept"
          kop: "Een module kan meegroeien"
          reactie: "Losse modules werk je apart bij als het beleid verandert. De teksten pas je zelf aan in Prepo."
          stap: { label: "Lees hoe een module in jullie LMS komt", href: "#faq-lms" }
          formulier: "Vertel wanneer jullie het beleid verwachten."
        - waarde: nee
          label: "Nog niet"
          sub: "Er zijn nog geen afspraken"
          kop: "Het beleid is de eerste stap"
          reactie: "Wij maken het speelbaar als het er is; het beleid zelf schrijven we niet. Een module over een ander onderwerp kan nu al."
          stap: { label: "Lees waar we mee beginnen", href: "#faq-begin" }
          formulier: "Vertel welk onderwerp bij jullie nu het meest ontbreekt."
  - pad: security
    sectie: voor-security
    label: "Ik ben verantwoordelijk voor security"
    sub: "Je wilt dat mensen veilig handelen"
    reactie: "Jij gaat over security. Hieronder: de kleine momenten waar het op aankomt."
    kaart: { src: /assets/images/verhalen/nnvo-it-veiligheid-tegel-k3.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/nnvo-it-veiligheid.png, alt: "" }
    titel: "Veilig gedrag zit in kleine momenten"
    alineas:
      - "Cybergedrag leer je niet alleen uit een jaarlijkse training. Het zit in kleine momenten: een bericht dat net niet klopt, een collega die meekijkt, een usb-stick op de parkeerplaats. Voor wie onder de Cyberbeveiligingswet valt, is dat sinds 15 augustus 2026 ook een zorgplicht."
      - "Wij maken die momenten speelbaar, met jullie eigen situaties en jullie eigen regels. In jullie LMS of in Prepo zie je wie een module heeft gedaan, en waar mensen verkeerd kiezen. We beloven geen compliance; we zorgen dat mensen weten wat ze moeten doen."
    vraag:
      id: awareness-nu
      vraag: "Wat doen jullie nu aan awareness?"
      veld: "Awareness nu"
      antwoorden:
        - waarde: abonnement
          label: "Een abonnement op een platform"
          sub: "Met phishingtests of een catalogus"
          kop: "Dat abonnement houd je"
          reactie: "De modules komen ernaast en gaan over de situaties die alleen bij jullie voorkomen."
          stap: { label: "Lees hoe het naast een catalogus past", href: "#faq-catalogus" }
          formulier: "Noem het platform en een situatie die er niet in staat."
        - waarde: jaarlijks
          label: "Een jaarlijkse training"
          sub: "Eén keer per jaar, voor iedereen"
          kop: "Het gat zit tussen twee trainingen"
          reactie: "Korte modules wijs je los toe, ook bij de onboarding. Zo komt een onderwerp vaker dan één keer per jaar langs."
          stap: { label: "Bekijk hoe een module ontstaat", href: "#hoe-het-werkt" }
          formulier: "Vertel wanneer de training is en wat er tussendoor misgaat."
        - waarde: niets
          label: "Niets vasts"
          sub: "Af en toe een mail of een bericht op intranet"
          kop: "Begin met één situatie"
          reactie: "Eén module over wat bij jullie het vaakst voorkomt. Daarna zie je hoe medewerkers erop reageren voordat je meer doet."
          stap: { label: "Lees waar we mee beginnen", href: "#faq-begin" }
          formulier: "Vertel welke situatie bij jullie het vaakst voorkomt."

probeer:
  type: dilemma
  titel: "Probeer één situatie"
  lead: "Zo werkt een situatie in een module, hier over AI-gebruik. In een module voor jullie staat bij elke keuze wat jullie eigen beleid zegt."
  dilemma:
    id: dilemma-ai
    veld: "Dilemma"
    situatie: "Een inwoner mailt een klacht, met naam, adres en details over een zorgaanvraag. Je wilt snel een nette, rustige reactie sturen. Een AI-chatbot schrijft die tekst in een minuut."
    vraag: "Wat doe je?"
    antwoorden:
      - waarde: openbare-chatbot
        label: "Ik plak de mail in een openbare chatbot"
        kop: "De gegevens staan nu bij een externe dienst"
        gevolg: "Na een minuut heb je een nette reactie. Naam, adres en zorgaanvraag van de inwoner staan nu bij een AI-dienst."
        reactie: "Wat die dienst ermee doet, weet je niet. In een module staat hier jullie eigen regel."
      - waarde: anonimiseren
        label: "Ik haal eerst naam en adres weg"
        kop: "Zonder naam nog te herkennen"
        gevolg: "Je haalt naam en adres weg en plakt de rest in de chatbot. De details over de zorgaanvraag gaan mee."
        reactie: "Met die details is iemand vaak nog te herkennen. Wat jullie beleid hier zegt, is in een module het antwoord."
      - waarde: interne-tool
        label: "Ik gebruik de AI-tool die we intern mogen gebruiken"
        kop: "Vaak precies wat het beleid bedoelt"
        gevolg: "Je opent de assistent die jullie mogen gebruiken en plakt de mail erin."
        reactie: "Weet iedereen welke tool dat is, en wat er wel en niet in mag? Daar gaat een module over."
      - waarde: zelf-schrijven
        label: "Ik schrijf het zelf"
        kop: "Veilig, en het kost tijd"
        gevolg: "Twintig minuten later staat je antwoord er. De volgende klacht wacht al."
        reactie: "Een goed beleid zegt ook wat wél mag, zodat mensen niet uit voorzichtigheid alles zelf blijven doen."
    groep:
      titel: "Wat jij daarna ziet"
      tekst: "Zo kiest een voorbeeldgroep van elf medewerkers, en jij. In Prepo zie je dit per situatie voor jullie eigen medewerkers."
      aantallen: { openbare-chatbot: 2, anonimiseren: 5, interne-tool: 3, zelf-schrijven: 1 }
      advies: "De grootste groep haalt naam en adres weg en plakt de rest erin. Daar gaat je volgende uitleg over: ook zonder naam is iemand te herkennen."
      meta: "Voorbeeldgegevens: elf medewerkers en jij."
  claim: "Wij ontwerpen jullie onboarding niet en schrijven jullie beleid niet. Jullie weten wat erin moet; wij maken het speelbaar."

stappen:
  items:
    - titel: "Jullie kiezen het onderwerp"
      tekst: "AI-gebruik, cybergedrag of een ander onderwerp dat nu ontbreekt."
      beeld: { src: /assets/images/verhalen/maria-indelen.png, alt: "" }
    - titel: "Wij maken er een module van"
      tekst: "Met jullie situaties en jullie beleid. Kort, speelbaar, apart toe te wijzen."
      beeld: { src: /assets/images/verhalen/maria-workflow.jpg, alt: "" }
    - titel: "Hij draait naast wat er al is"
      tekst: "Als SCORM-bestand in jullie leerplatform. Verandert het beleid, dan pas je de teksten zelf aan in Prepo en zet je een nieuwe versie klaar."
      beeld: { src: /assets/images/verhalen/nnvo-it-veiligheid-tegel-k1.jpg, alt: "" }

bewijs:
  beeld: { src: /assets/images/verhalen/onitnow-verhaal-maria.jpg, alt: "Beeld uit Het verhaal van Maria" }
  alineas:
    - "Voor onITnow maakten we <strong>Het verhaal van Maria</strong>. Maria werkt op de servicedesk van een gemeente en komt door alle verzoeken niet meer aan haar eigen werk toe. In een stripverhaal en vijf MicroGames leren nieuwe en bestaande medewerkers de principes van USM, een aanpak voor servicemanagement."
    - "Samen met NNVO ontwikkelen we MicroGames over <strong>IT-veiligheid</strong>: herkenbare situaties waarin mensen zelf kiezen en meteen zien wat werkt."

vragen:
  label: "Vragen over losse modules"
  items:
    - { id: catalogus, vraag: "We hebben al een leerplatform met een catalogus.", antwoord: "Dat blijft. Dit komt ernaast, voor de situaties die alleen bij jullie voorkomen en die geen catalogus heeft." }
    - { id: zelf-maken, vraag: "Kunnen we dit niet zelf maken met AI?", antwoord: "Een quiz of een tekst wel. Wat wij erbij doen: het verhaal en de keuzes ontwerpen, het testen met jullie medewerkers, en het beheer in Prepo, zodat de module bij blijft als het beleid verandert." }
    - { id: ai-act, vraag: "Is dit verplicht onder de AI Act?", antwoord: "Daar doen we geen uitspraak over. Wat we wel weten: mensen gebruiken AI, en het beleid helpt alleen als ze weten wat erin staat." }
    - { id: lms, vraag: "Draait het in ons LMS?", antwoord: "Ja. Je krijgt een SCORM-bestand voor je eigen leerplatform; de afronding per medewerker komt daar binnen. Zonder LMS gaat het via een link in Prepo, onze beheeromgeving, waar je deelname en voortgang ziet." }
    - { id: begin, vraag: "Waar begin je mee?", antwoord: "Met één onderwerp dat nu ontbreekt, in één module. Dan zie je hoe medewerkers erop reageren voordat je meer doet." }

afspraak:
  titel: "Begin met één module"
  lead: "Kies hieronder een moment voor een online kennismaking van een half uur. We kiezen samen het onderwerp dat nu ontbreekt."

formulier:
  titel: "Of vraag de moduleopzet aan"
  lead: "Vertel welk beleid of welke situatie je wilt laten landen. We sturen een korte opzet van een module en nemen contact met je op."
  noot: "Je krijgt binnen één werkdag een persoonlijk antwoord, geen nieuwsbrief."
