# Casus 1 — Betere praktijkdagen. Inhoud voor _includes/varianten/pagina-d.html.
# Bron: _marketing/casus-1-praktijkdagen.md en het plan van aanpak.
# Claimgrens: we vervangen de praktijkdag niet; klantnamen als Royal Mutua niet noemen.

hero:
  titel: "Je herhaalt op de trainingsdag wat ze in de e-learning al gehad hebben"
  lead: "Wij maken de voorbereiding speelbaar, op maat van jullie training. Deelnemers oefenen vooraf met situaties uit hun vak, en de instructeur ziet 's&nbsp;ochtends waar de groep staat. Zo gaat de praktijkdag naar oefenen."
  video:
    file: "cowijzer-melder-explainer.mp4?v=2"
    poster: /assets/images/verhalen/co-wijzer-melder-video-poster.jpg
    title: "CO Wijzer explainer (hero)"
    label: "Explainer van CO Wijzer: een huis in doorsnede waarin per ruimte een CO-melder wordt geplaatst"
    caption: "Voorbeeld uit ons werk: CO Wijzer, de voorbereiding voor monteurs. Een minuut uit het spel."

rollen:
  - pad: instructeur
    sectie: voor-instructeur
    label: "Ik geef de training"
    sub: "Je staat zelf voor de groep"
    reactie: "Jij geeft de training. Hieronder: wat jij ervan merkt op de dag."
    kaart: { src: /assets/images/verhalen/co-wijzer-ketel.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/basis-koeltechniek-diagram.jpg, alt: "Scène uit Basis Koeltechniek: de deelnemer wijst punten aan in het h-log-P-diagram van een koelinstallatie" }
    titel: "Je weet 's&nbsp;ochtends niet wie wat mist"
    alineas:
      - "Dus begin je bij het begin, voor de zekerheid. Dat is goed lesgeven, en het kost de ochtend."
      - "Hebben deelnemers vooraf al gekozen in situaties uit hun vak, dan zie jij vóór de dag waar het misging. Daar begin je. De rest van de dag is voor de hal."
    vraag:
      id: herhaal-tijd
      vraag: "Hoeveel van je ochtend gaat er op aan herhalen?"
      veld: "Herhalen"
      antwoorden:
        - waarde: kwartier
          label: "Een kwartier"
          sub: "Een korte opfrisser en door"
          kop: "De vraag is eerder wie wat mist"
          reactie: "Een kwartier is weinig. De winst zit in weten wie wat mist voordat de dag begint. In de melder hieronder zie je hoe dat eruitziet."
          stap: { label: "Hang de melder op en zie wat je vooraf weet", href: "#probeer" }
          formulier: "Vertel welke training je geeft en wat je vooraf over de groep zou willen weten."
        - waarde: uur
          label: "Ongeveer een uur"
          sub: "Het eerste blok van de dag"
          kop: "Dat uur gaat van de oefentijd af"
          reactie: "Met een voorbereiding die blijft hangen, besteed je het aan wie het nodig heeft. Je ziet vooraf per situatie hoe de groep koos."
          stap: { label: "Lees waar je ziet hoe de groep het deed", href: "#faq-groepsoverzicht" }
          formulier: "Vertel welke uitleg je elke keer opnieuw geeft."
        - waarde: halve-ochtend
          label: "Een halve ochtend"
          sub: "Tot de koffie, of langer"
          kop: "Het oefenen schuift naar later op de dag"
          reactie: "Weet je waar de groep staat, dan begin je daar, en niet bij hoofdstuk één. Je kijkt de dag ervoor en ziet waar het misging."
          stap: { label: "Lees wat je de dag ervoor ziet", href: "#faq-groepsoverzicht" }
          formulier: "Vertel welke onderdelen je 's ochtends herhaalt en hoe groot je groepen zijn."
        - waarde: meer
          label: "Meer dan dat"
          sub: "De hal komt pas na de lunch"
          kop: "Een theoriedag met een stuk praktijk"
          reactie: "Hier is het meeste te winnen. In een half uur zoeken we uit welke uitleg naar de voorbereiding kan."
          stap: { label: "Bespreek welk deel van de dag je terug wilt", href: "#afspraak" }
          formulier: "Vertel hoe de dag nu is ingedeeld en wat je in de hal tekortkomt."
  - pad: koper
    sectie: voor-koper
    label: "Ik beslis over de training"
    sub: "Je kiest wat er vooraf en op de dag gebeurt"
    reactie: "Jij beslist over de training. Hieronder: wat het jullie oplevert, en hoe het past bij wat er al is."
    kaart: { src: /assets/images/verhalen/studium-co-wijzer.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/basis-koeltechniek-onderdelen.jpg, alt: "Scène uit Basis Koeltechniek: de deelnemer kiest bij een omschrijving het juiste onderdeel van het koelcircuit" }
    titel: "De dag is al korter gemaakt, en begint nog steeds met theorie"
    alineas:
      - "De klant wilde minder verlet, dus kwam er een e-learning vooraf. Een gehaalde toegangstoets zegt weinig over wat er op de dag nog van over is."
      - "Wij maken van de momenten waar de dag op vastloopt korte speelbare situaties. Die draaien in jullie eigen leeromgeving, naast de e-learning die er al is."
    vraag:
      id: eigenaar-elearning
      vraag: "Van wie is de e-learning die jullie nu vooraf gebruiken?"
      veld: "E-learning vooraf"
      antwoorden:
        - waarde: zelf
          label: "Die maken we zelf"
          sub: "Eigen inhoud, in jullie eigen LMS"
          kop: "Korter kan, het hoeft niet"
          reactie: "Wat deelnemers al spelend oefenen, hoef je niet ook nog uit te leggen. Of de e-learning daardoor korter wordt, is een keuze en geen voorwaarde."
          stap: { label: "Lees hoeveel tijd het de deelnemer kost", href: "#faq-werk-erbij" }
          formulier: "Noem de training en het LMS waar de e-learning in staat."
        - waarde: leverancier
          label: "Die komt van een leverancier"
          sub: "Ingekocht of in licentie"
          kop: "Die blijft zoals hij is"
          reactie: "De situaties komen ernaast, voor de momenten waar jullie dag op vastloopt. Ze draaien in dezelfde leeromgeving."
          stap: { label: "Lees hoe het in jullie leeromgeving komt", href: "#faq-leeromgeving" }
          formulier: "Noem de training, de leverancier en jullie LMS."
        - waarde: normsteller
          label: "Die is verplicht vanuit een normsteller"
          sub: "Met een toets die deelnemers moeten halen"
          kop: "De verplichte e-learning blijft, met toets en al"
          reactie: "Dit komt ernaast en gaat over wat er op de dag nog van over is. Het kost de deelnemer een paar minuten per situatie."
          stap: { label: "Lees hoe het naast een verplichte e-learning past", href: "#faq-werk-erbij" }
          formulier: "Noem de normsteller en de training waar het om gaat."

probeer:
  type: co-melder
  titel: "Hang de CO-melder op"
  lead: "Zo oefent een monteur in CO Wijzer, vóór de praktijkdag. Daarna zie je wat de instructeur ziet."
  claim: "We vervangen de praktijkdag niet. We zorgen dat die dag naar oefenen gaat."

stappen:
  items:
    - titel: "We zoeken waar de dag op vastloopt"
      tekst: "Samen met jullie instructeurs: welke uitleg komt elke keer terug, en waar gaat het in de hal mis?"
      beeld: { src: /assets/images/verhalen/basis-koeltechniek-gesprek.jpg, alt: "" }
    - titel: "Dat worden korte speelbare situaties"
      tekst: "De deelnemer kiest, ziet wat er gebeurt en krijgt uitleg. Een paar minuten per situatie, in jullie eigen leeromgeving."
      beeld: { src: /assets/images/verhalen/basis-koeltechniek-kringloop.jpg, alt: "" }
    - titel: "De instructeur ziet waar de groep staat"
      tekst: "Vóór de dag ziet de instructeur per situatie hoe de groep koos, in Prepo of in jullie LMS. De dag begint bij wat misging."
      beeld: { src: /assets/images/verhalen/co-wijzer-ruimtes.jpg, alt: "" }

bewijs:
  beeld: { src: /assets/images/verhalen/basis-koeltechniek-video-poster.jpg, alt: "Titelbeeld van Basis Koeltechniek" }
  alineas:
    - "21CC Education kwam bij ons met de vraag die op deze pagina staat: hun praktijkdagen moesten meer opleveren, en daar hoorde een voorbereiding vooraf bij. Met hen en Studium maakten we <strong>CO Wijzer</strong>. Met Climatools, 21CC Learning en Studium volgde <strong>Basis Koeltechniek</strong>: negen MicroGames voor installatiemonteurs."

vragen:
  label: "Vragen over de voorbereiding"
  items:
    - { id: vervangt, vraag: "Vervangt dit de praktijkdag?", antwoord: "Nee. We vervangen de praktijkdag niet. Wat in de hal geoefend moet worden, blijft in de hal. De voorbereiding zorgt dat er meer tijd voor overblijft." }
    - { id: groepsoverzicht, vraag: "Waar ziet de instructeur hoe de groep het deed?", antwoord: "In Prepo, onze eigen beheeromgeving: daar staan deelname, voortgang en scores per situatie. Draait het in jullie eigen LMS, dan komen de resultaten per deelnemer daar binnen. De instructeur kijkt de dag ervoor en weet waar hij begint." }
    - { id: leeromgeving, vraag: "Draait het in onze leeromgeving?", antwoord: "Ja. Je krijgt een SCORM-bestand dat je in je eigen LMS zet, naast de e-learning die er al staat. Zonder LMS gaat het via een gewone link in Prepo; deelnemers hebben dan alleen die link nodig." }
    - { id: werk-erbij, vraag: "Komt er dan werk bij voor de deelnemer?", antwoord: "Een paar minuten per situatie, vooraf, op de telefoon of de laptop. Schrijft een normsteller of exameninstelling de e-learning voor, dan blijft die staan. Dit komt ernaast en gaat over de momenten waar de dag op vastloopt." }
    - { id: gamers, vraag: "Onze deelnemers zijn geen gamers.", antwoord: "Dat hoeven ze ook niet te zijn. Een situatie duurt een paar minuten en lijkt op hun werk: een klant, een installatie, een keuze. Ze spelen het op de telefoon of de laptop." }
    - { id: korter, vraag: "Wordt de praktijkdag dan nog korter?", antwoord: "Dat beslissen jullie. Wij sturen op meer oefentijd op dezelfde dag. Een meta-analyse van 114 studies naar voorbereiding vooraf vond een groter effect als de contacttijd niet werd ingekort. Bij één opdrachtgever, een vijfdaagse training op locatie, konden wel twee dagen vervallen toen deelnemers vooraf oefenden. Dat is één traject en geen belofte." }
    - { id: begin, vraag: "Waar begin je mee?", antwoord: "Met één moment uit één training: de uitleg die elke keer terugkomt. Dan weet je of het werkt voordat je meer doet." }

afspraak:
  titel: "Versterk jouw praktijkdag"
  lead: "Kies hieronder een moment voor een online kennismaking van een half uur. We kijken samen welk moment van de dag je als eerste terug wilt, en hoe een voorbereiding daar past."

formulier:
  titel: "Of stuur ons een bericht"
  lead: "Vertel om welke training het gaat en waar de dag op vastloopt."
  noot: "Je krijgt binnen één werkdag een persoonlijk antwoord, geen nieuwsbrief."
