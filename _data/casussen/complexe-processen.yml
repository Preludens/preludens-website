# Casus 2 — Complexe processen zichtbaar maken. Inhoud voor _includes/varianten/pagina-d.html.
# Bron: _marketing/casus-2-complexe-processen.md en het plan van aanpak (werkkeuze:
# variant B, versmald tot "een leerling of zij-instromer het werk van een planner
# laten doen, rond het bezoek").
# Claimgrens: we zijn geen logistiek adviesbureau; geen uitspraken over begrip of
# overtuiging die niet gemeten zijn. Nog na te gaan: mag Yard Crane Scheduler
# getoond worden, en onder welke naam?

hero:
  titel: "Ze zijn één keer in de haven geweest. Daarna horen ze er jaren niets meer van."
  lead: "Wij laten leerlingen, studenten en zij-instromers het werk zelf doen, vóór of na het bezoek. In een speelbaar verhaal plannen ze containers op een terminal en zien ze wat elke keuze doet."
  knop: "Zie een tweede voorbeeld"
  video:
    file: "ycs-explainer.mp4"
    poster: /assets/images/verhalen/yard-crane-scheduler-video-poster.jpg
    title: "Yard Crane Scheduler explainer (hero)"
    label: "Explainer van Yard Crane Scheduler: containers plannen op een terminal en zien hoe elke keuze de doorlooptijd van een schip beïnvloedt"
    caption: "Voorbeeld uit ons werk: Yard Crane Scheduler, gemaakt voor TU Delft."

rollen:
  - pad: docent
    sectie: voor-docent
    label: "Ik geef les aan de groep"
    sub: "Je bereidt het bezoek voor of werkt het na"
    reactie: "Jij geeft les. Hieronder: wat het spel doet rond het bezoek."
    kaart: { src: /assets/images/verhalen/yard-crane-hub.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/yard-crane-planning.png, alt: "Scène uit Yard Crane Scheduler: de speler plant welke container de kraan als eerste oppakt" }
    titel: "Na de rondleiding weten ze hoe groot het is. Niet wat het werk is."
    alineas:
      - "Een bezoek maakt indruk: de kranen, de schaal, het tempo. Wat een planner de hele dag doet, zie je vanaf de bus niet."
      - "In een speelbaar verhaal doen ze dat werk zelf. Ze plannen containers op een terminal en merken dat elke keuze doorwerkt in de doorlooptijd van een schip. Daarna kijken ze met andere ogen naar dezelfde kades."
    vraag:
      id: bezoek-moment
      vraag: "Wanneer zou je het inzetten?"
      antwoorden:
        - { waarde: vooraf, label: "Vóór het bezoek", reactie: "Dan weten ze waar ze naar kijken. Ze herkennen de kraan die ze zelf hebben aangestuurd." }
        - { waarde: achteraf, label: "Na het bezoek", reactie: "Dan wordt het bezoek meer dan een uitje. Wat ze zagen, krijgt een plek in hun eigen keuzes." }
        - { waarde: geen-bezoek, label: "Er is geen bezoek", reactie: "Dan brengt het spel de terminal naar de klas, ook als die niet in Rotterdam staat." }
  - pad: organisator
    sectie: voor-organisator
    label: "Ik organiseer het programma"
    sub: "Je bent verantwoordelijk voor educatie of human capital"
    reactie: "Jij organiseert het programma. Hieronder: wat het jullie oplevert, en hoe het past bij wat er al is."
    kaart: { src: /assets/images/verhalen/disruption-game.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/disruption-keuze.jpg, alt: "Scène uit The Disruption Game: de speler kiest hoe te reageren op een logistieke verstoring" }
    titel: "De vacatures zijn er. Het werk blijft onzichtbaar."
    alineas:
      - "De haven zoekt mensen: er staan zo'n 6.000 vacatures open, en twee derde daarvan is moeilijk te vullen. Een rondleiding laat de schaal zien, niet het vak."
      - "Wij maken van een functie uit jullie haven een speelbaar verhaal: het werk van een planner, een controller of een operator. Leerlingen doen het zelf, vóór of na het bezoek, en vanuit elke stad."
    vraag:
      id: aanbod-nu
      vraag: "Wat bieden jullie scholen nu aan?"
      antwoorden:
        - { waarde: rondleiding, label: "Een rondleiding of excursie", reactie: "Dan komt dit ernaast: het spel bereidt het bezoek voor of werkt het na. De rondleiding blijft." }
        - { waarde: lespakket, label: "Een lespakket of gastles", reactie: "Dan kan een speelbaar verhaal het deel worden waarin ze het werk zelf doen, naast het verhaal van de gastdocent." }
        - { waarde: niets, label: "Nog niets vasts", reactie: "Dan is één functie een goed begin: één rol, één verhaal, en zien hoe leerlingen erop reageren." }

probeer:
  type: video
  titel: "Beslissen tijdens een verstoring"
  lead: "Uit The Disruption Game, ook voor TU Delft: een logistieke verstoring, met onvolledige informatie en belangen die schuren."
  video:
    file: "disruption-explainer.mp4"
    poster: /assets/images/verhalen/maryland-disruption-game-video-poster.jpg
    title: "The Disruption Game explainer"
    label: "Explainer van The Disruption Game: beslissingen nemen tijdens een logistieke verstoring"
    caption: "Een minuut uit The Disruption Game."
  claim: "Wij zijn geen logistiek adviesbureau. Jullie weten hoe het proces werkt; wij maken het speelbaar."

stappen:
  items:
    - titel: "We kiezen samen één functie"
      tekst: "Welk werk willen jullie zichtbaar maken: planner, controller, operator?"
      beeld: { src: /assets/images/verhalen/yard-crane-indelen.png, alt: "" }
    - titel: "Wij maken er een speelbaar verhaal van"
      tekst: "Met jullie mensen erbij, zodat het klopt. Spelers kiezen en zien wat hun keuzes doen."
      beeld: { src: /assets/images/verhalen/disruption-situatie.jpg, alt: "" }
    - titel: "Het werkt vóór, na of zonder bezoek"
      tekst: "In de klas, op een event of thuis, op een laptop of telefoon."
      beeld: { src: /assets/images/verhalen/yard-crane-laden.png, alt: "" }

bewijs:
  beeld: { src: /assets/images/verhalen/yard-crane-scheduler.png, alt: "Titelbeeld van Yard Crane Scheduler" }
  titel: "Al vaak gespeeld"
  alineas:
    - "<strong>Yard Crane Scheduler</strong> maakten we voor TU Delft. Deelnemers plannen containers op een terminal en merken hoe elke keuze de doorlooptijd van een schip beïnvloedt. Er zijn ruim 20.000 missies in gespeeld."
    - "Met <strong>The Disruption Game</strong>, ook voor TU Delft, oefenen deelnemers met beslissingen tijdens een logistieke verstoring."

vragen:
  label: "Vragen over een speelbaar verhaal"
  items:
    - { vraag: "We hebben al een rondleiding of een bezoekerscentrum.", antwoord: "Dat blijft. Dit komt ernaast: het spel bereidt het bezoek voor of werkt het na, en werkt ook voor wie niet kan komen." }
    - { vraag: "Kan een universiteit dit niet maken?", antwoord: "Dat kan, en veel havengames zijn zo ontstaan. Het verschil zit in wat er na het project gebeurt: een spel dat gespeeld blijft worden. In Yard Crane Scheduler zijn ruim 20.000 missies gespeeld." }
    - { vraag: "Wie bepaalt wat er in het spel klopt?", antwoord: "Jullie. Wij zijn geen logistiek adviesbureau: jullie kennen het proces, wij maken het speelbaar en testen het met jullie mensen." }
    - { vraag: "Wat kost het?", antwoord: "Dat hangt af van de functie en het aantal situaties. Je kunt klein beginnen: één rol, één verhaal. Dan weet je of het werkt voordat je meer doet." }

afspraak:
  titel: "Verken jullie proces"
  lead: "Kies hieronder een moment voor een online kennismaking van een half uur. We kijken samen welk werk je zichtbaar wilt maken, en voor wie. Daarna kan een GameStorm volgen, waarin we het proces samen uitpluizen."

formulier:
  titel: "Of stuur ons een bericht"
  lead: "Vertel welk proces of welke functie je wilt laten zien. We nemen contact met je op."
  noot: "Je krijgt een persoonlijk antwoord, geen nieuwsbrief."
