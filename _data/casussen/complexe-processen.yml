# Casus 2 — Complexe processen zichtbaar maken. Inhoud voor _includes/varianten/pagina-d.html.
# Bron: _marketing/casus-2-complexe-processen.md en het plan van aanpak (werkkeuze:
# variant B, versmald tot "een leerling of zij-instromer het werk van een planner
# laten doen, rond het bezoek"). Persona-review: _marketing/reviews/persona-review-complexe-processen.md.
# Claimgrens: we zijn geen logistiek adviesbureau; geen uitspraken over begrip of
# overtuiging die niet gemeten zijn; geen prijzen. Yard Crane Scheduler mag getoond
# worden (12 november 2026). Bij The Disruption Game noemen we geen opdrachtgever:
# de verhaalpagina zegt TU Delft, de video toont het logo van de University of Maryland.

hero:
  titel: "Ze zijn één keer in de haven geweest. Daarna horen ze er jaren niets meer van."
  lead: "Wij maken een speelbaar verhaal waarin leerlingen, studenten en zij-instromers het werk in jullie haven zelf doen, vóór of na het bezoek. Zo zien ze een beroep van binnen, en niet alleen de schaal."
  knop: "Bekijk hoe het werkt"
  knop_href: "#hoe-het-werkt"
  video:
    file: "ycs-explainer.mp4"
    poster: /assets/images/verhalen/yard-crane-scheduler-video-poster.jpg
    title: "Yard Crane Scheduler explainer (hero)"
    label: "Explainer van Yard Crane Scheduler: containers plannen op een terminal en zien hoe elke keuze de doorlooptijd van een schip beïnvloedt"
    caption: "Voorbeeld uit ons werk: Yard Crane Scheduler, met de TU Delft. Het spel is Engels; een verhaal voor jullie haven maken we in de taal van jullie leerlingen."

rollen:
  - pad: organisator
    sectie: voor-organisator
    label: "Ik organiseer het programma"
    sub: "Je bent verantwoordelijk voor onderwijs of arbeidsmarkt"
    reactie: "Jij organiseert het programma. Hieronder: wat het jullie oplevert, en hoe het past bij wat er al is."
    kaart: { src: /assets/images/verhalen/yard-crane-laden.png, alt: "" }
    beeld: { src: /assets/images/verhalen/disruption-rol.jpg, alt: "Scène uit The Disruption Game: de rol van de controller op een containerterminal, met veiligheid als eerste focus" }
    titel: "De vacatures zijn er. Het werk blijft onzichtbaar."
    alineas:
      - "In de Rotterdamse haven alleen al staan zo'n 6.000 vacatures open, en twee derde daarvan is moeilijk te vullen. Een rondleiding laat de schaal zien. Wat een planner, controller of operator de hele dag doet, blijft buiten beeld."
      - "Wij maken van een functie uit jullie haven een speelbaar verhaal. Leerlingen doen het werk zelf, vóór of na het bezoek, en ook vanuit een school die een uur rijden verderop staat."
    vraag:
      id: aanbod-nu
      vraag: "Wat bieden jullie scholen nu aan?"
      antwoorden:
        - { waarde: rondleiding, label: "Een rondleiding of excursie", reactie: "Dan komt dit ernaast: het spel bereidt het bezoek voor of werkt het na. De rondleiding blijft." }
        - { waarde: lespakket, label: "Een lespakket of gastles", reactie: "Dan kan een speelbaar verhaal het deel worden waarin ze het werk zelf doen, naast het verhaal van de gastdocent." }
        - { waarde: niets, label: "Nog niets vasts", reactie: "Dan is één functie een goed begin: één rol, één verhaal, en zien hoe leerlingen erop reageren." }
  - pad: docent
    sectie: voor-docent
    label: "Ik geef les aan de groep"
    sub: "Je bereidt het bezoek voor of werkt het na"
    reactie: "Jij geeft les. Hieronder: wat het spel doet rond het bezoek."
    kaart: { src: /assets/images/verhalen/yard-crane-hub.jpg, alt: "" }
    beeld: { src: /assets/images/verhalen/yard-crane-planning.png, alt: "Scène uit Yard Crane Scheduler: de speler plant welke container de kraan als eerste oppakt" }
    titel: "Na de rondleiding weten ze hoe groot het is. Niet wat het werk is."
    alineas:
      - "Een bezoek maakt indruk: de kranen, de schaal, het tempo. Wat een planner de hele dag doet, zie je vanaf de bus niet."
      - "In een speelbaar verhaal doen ze dat werk zelf. Ze plannen containers op een terminal en merken dat elke keuze doorwerkt in de doorlooptijd van een schip. Daarna kijken ze met andere ogen naar dezelfde kades."
    vraag:
      id: bezoek-moment
      vraag: "Wanneer zou je het inzetten?"
      antwoorden:
        - { waarde: vooraf, label: "Vóór het bezoek", reactie: "Dan weten ze waar ze naar kijken. Ze herkennen de kraan die ze zelf hebben aangestuurd." }
        - { waarde: achteraf, label: "Na het bezoek", reactie: "Dan krijgt wat ze zagen een plek in hun eigen keuzes." }
        - { waarde: geen-bezoek, label: "Er is geen bezoek", reactie: "Dan brengt het spel de terminal naar de klas, ook als de haven een uur rijden is." }

probeer:
  type: video
  titel: "Beslissen tijdens een verstoring"
  lead: "Een tweede voorbeeld, uit The Disruption Game: je speelt Frank, de controller op een containerterminal, op de dag dat de truckers staken. Elke keuze verschuift de situatie waarin je de volgende neemt."
  video:
    file: "disruption-explainer.mp4"
    poster: /assets/images/verhalen/maryland-disruption-game-video-poster.jpg
    title: "The Disruption Game explainer"
    label: "Explainer van The Disruption Game: beslissingen nemen tijdens een logistieke verstoring"
    caption: "Een minuut uit The Disruption Game. Het spel en de voice-over zijn Engels."
  claim: "Wij zijn geen logistiek adviesbureau. Jullie weten hoe het werk gaat; wij maken het speelbaar."

stappen:
  items:
    - titel: "We kiezen samen één functie"
      tekst: "Welk werk willen jullie zichtbaar maken: planner, controller of operator, bij containers, bulk, energie of binnenvaart?"
      beeld: { src: /assets/images/verhalen/yard-crane-indelen.png, alt: "" }
    - titel: "Wij maken er een speelbaar verhaal van"
      tekst: "Met jullie mensen erbij, zodat het klopt. Spelers kiezen en zien wat hun keuzes doen."
      beeld: { src: /assets/images/verhalen/disruption-situatie.jpg, alt: "" }
    - titel: "Het werkt vóór, na of zonder bezoek"
      tekst: "In de klas, op een event of thuis, op een laptop, tablet of telefoon."
      beeld: { src: /assets/images/verhalen/yard-crane-score.png, alt: "" }

bewijs:
  beeld: { src: /assets/images/verhalen/yard-crane-scheduler.png, alt: "Titelbeeld van Yard Crane Scheduler" }
  titel: "Al vaak gespeeld"
  alineas:
    - "<strong>Yard Crane Scheduler</strong> is een van onze eerste MicroGames, gemaakt met de TU Delft. Deelnemers plannen containers op een terminal en merken hoe elke keuze de doorlooptijd van een schip beïnvloedt. In zo'n veertien jaar logistiek onderwijs zijn er meer dan 20.000 missies in gespeeld. In 2026 bouwen we het spel samen opnieuw op."
    - "In <strong>The Disruption Game</strong> oefenen deelnemers met beslissingen tijdens een logistieke verstoring, met onvolledige informatie en belangen die schuren."

vragen:
  label: "Vragen over een speelbaar verhaal"
  items:
    - { vraag: "We hebben al een rondleiding of een bezoekerscentrum.", antwoord: "Dat blijft. Dit komt ernaast: het spel bereidt het bezoek voor of werkt het na, en werkt ook voor wie niet kan komen." }
    - { vraag: "Wie onderhoudt het over drie jaar?", antwoord: "Het spel staat in Prepo, onze beheeromgeving. Daar pas je zelf teksten aan als het werk verandert, en zie je hoe vaak het gespeeld wordt. Yard Crane Scheduler wordt al zo'n veertien jaar gespeeld." }
    - { vraag: "Past het in een lesuur, en werkt het op een schooltablet?", antwoord: "Het draait in de browser, op een laptop, tablet of telefoon, via een link zonder installatie. Hoe lang een verhaal duurt, stemmen we af op jullie les." }
    - { vraag: "Wie bepaalt wat er in het spel klopt?", antwoord: "Jullie. Wij zijn geen logistiek adviesbureau: jullie kennen het werk, wij maken het speelbaar en testen het met jullie mensen." }
    - { vraag: "Waar begin je mee?", antwoord: "Met één functie en één verhaal. Dan zie je hoe leerlingen erop reageren voordat je meer doet." }

afspraak:
  titel: "Kies het werk dat je wilt laten zien"
  lead: "Kies hieronder een moment voor een online kennismaking van een half uur. We kijken samen welk beroep je zichtbaar wilt maken, en voor welke leerlingen."

formulier:
  titel: "Of stuur ons een bericht"
  lead: "Vertel welk werk je wilt laten zien, en waar je nu tegenaan loopt."
  noot: "Je krijgt binnen één werkdag een persoonlijk antwoord, geen nieuwsbrief."
