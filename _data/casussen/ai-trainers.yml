# AI Wijzer voor trainers die workshops en praktijkdagen verzorgen. Inhoud voor
# _includes/varianten/pagina-d.html.
# Bron: Daans doelgroepbeschrijving in Teams CRM › Marketing, 24 nov 2026 (zelfstandige
# trainers en facilitators; veilig AI-gebruik als hoofdonderwerp of onderdeel). Feiten
# over de demo uit _verhalen/ai-wijzer.md; 21CC en het groepsoverzicht uit
# _data/casussen/praktijkdagen.yml en de besluiten van ronde 5.
# Claimgrens: we schrijven het beleid niet; geen compliancebelofte; geen AI Act-claim
# (niet "verplicht"); de demo speelt bij het fictieve Northfield, een versie op maat
# gebruikt het beleid en de situaties van de opdrachtgever; geen prijzen; wie betaalt
# verschilt per opdracht; geen verzonnen resultaten. Het groepsoverzicht bestaat in
# Prepo en het LMS; we beloven geen live scherm in de zaal.
# Het dilemma in het probeerblok is een voorbeeld, geen opdracht uit de demo.
#
# title: AI Wijzer als werkvorm in je workshop over AI
# description: Een MicroGame waarin deelnemers zelf kiezen wat ze met AI delen. Voor trainers, vóór, tijdens of na de sessie. Speel de demo AI Wijzer.

hero:
  titel: "De zaal knikt bij de regels over AI. Wat ze morgen in een chatbot plakken, zie je niet."
  lead: "Zet AI Wijzer in je workshop. Elke deelnemer kiest op telefoon of laptop wat hij met een AI-dienst deelt en krijgt direct feedback. Speelt je groep via een eigen link, dan zie je per situatie hoe ze kozen, en begin je je uitleg waar het misging. Vooraf, tijdens of na de sessie."
  knop: "Speel de demo"
  knop_href: "#probeer"
  beeld:
    src: /assets/images/demo/bewust-met-ai-titel.jpg
    alt: "Het titelscherm van de MicroGame AI Wijzer"
    caption: "Het titelscherm van de demo AI Wijzer. Je werkt bij het fictieve bedrijf Northfield."

kies:
  titel: "Waar sta jij?"
  lead: "Sta je zelf voor de groep, of regel je de training? Kies, en je gaat naar het deel dat voor jou het belangrijkst is. Je kunt ook gewoon verder lezen."

rollen:
  - pad: trainer
    sectie: voor-trainer
    label: "Ik geef de workshop"
    sub: "Je bepaalt programma en werkvormen"
    reactie: "Jij geeft de workshop. Hieronder: wat AI Wijzer in je zaal doet."
    kaart: { src: /assets/images/verhalen/basis-koeltechniek-gesprek.jpg, alt: "" }
    beeld: { src: /assets/images/demo/bewust-met-ai-m1-beeld-1-inbox-bureau.jpg, alt: "Beeld uit AI Wijzer: een medewerker aan zijn bureau, met de mailbox van Northfield op het scherm" }
    titel: "Slides en voorbeelden heb je. Een oefening met een echte keuze nog niet"
    alineas:
      - "Je vertelt wat een AI-dienst met invoer doet, en je laat voorbeelden zien. Iedereen begrijpt het. Of iemand het ook doet als er een klantmail klaarstaat en de tijd dringt, merk je in de zaal niet."
      - "In AI Wijzer werkt elke deelnemer in een mailbox en een chatbot, kiest zelf en krijgt bij elke keuze feedback. Jij ziet per situatie hoe de groep koos. Dan bespreek je niet een voorbeeld van een ander, maar wat je eigen groep koos."
    vraag:
      id: trainer-moment
      vraag: "Waar in je programma zou je het inzetten?"
      veld: "Moment"
      antwoorden:
        - waarde: vooraf
          label: "Als voorbereiding"
          sub: "Deelnemers spelen vóór de sessie"
          kop: "Je weet vóór de sessie waar de groep staat"
          reactie: "Speelt de groep via een eigen link in Prepo, dan zie je per situatie hoe ze kozen. Je begint je uitleg waar het misging."
          stap: { label: "Lees wat je van de groep ziet", href: "#faq-groep-zien" }
          formulier: "Noem de datum van je sessie en de grootte van je groep."
        - waarde: tijdens
          label: "Tijdens de sessie"
          sub: "Als werkvorm in de zaal"
          kop: "Iedereen speelt op zijn eigen scherm"
          reactie: "Telefoon of laptop, niets installeren. Waar de groep verschillend kiest, heb je je gesprek."
          stap: { label: "Lees wat deelnemers nodig hebben", href: "#faq-laptop" }
          formulier: "Vertel hoe lang je sessie duurt en hoeveel tijd je voor een oefening hebt."
        - waarde: erna
          label: "Als vervolgopdracht"
          sub: "Terug op het werk"
          kop: "Ze oefenen nog een keer als het ertoe doet"
          reactie: "Onderzoek naar serious games vond meer effect als een spel over meerdere sessies loopt en andere instructie aanvult (Wouters e.a., 2013)."
          stap: { label: "Lees hoe vóór, tijdens en na werkt", href: "#faq-moment" }
          formulier: "Vertel wat deelnemers na je sessie anders moeten doen."
        - waarde: weet-niet
          label: "Dat weet ik nog niet"
          sub: "Ik wil het eerst zien"
          kop: "Speel eerst de demo"
          reactie: "Dan weet je wat een deelnemer doet en ziet. Het moment kiezen we daarna, in een gesprek van een half uur."
          stap: { label: "Ga naar de demo", href: "#probeer" }
          formulier: "Vertel welke workshop je geeft en voor wie."
  - pad: opdrachtgever
    sectie: voor-opdrachtgever
    label: "Ik organiseer de training"
    sub: "Je huurt een trainer in of regelt de dag"
    reactie: "Jij organiseert de training. Hieronder: wat er na de dag blijft hangen, en hoe het met jullie eigen afspraken kan."
    kaart: { src: /assets/images/verhalen/maria-strip-macbooks.jpg, alt: "" }
    beeld: { src: /assets/images/demo/bewust-met-ai-m2-beeld-1-ai-instellingen.jpg, alt: "Beeld uit AI Wijzer: een medewerker bekijkt de instellingen van een AI-chatbot op zijn laptop" }
    titel: "Na de workshop gaat iedereen weer aan het werk"
    alineas:
      - "De trainer maakt het onderwerp duidelijk. Met AI Wijzer oefent elke deelnemer daarnaast zelf, vóór de dag of in de weken erna. Jij ziet wie het gedaan heeft, en waar mensen nog verkeerd kiezen."
      - "Een versie op maat gebruikt jullie eigen afspraken en tools, in jullie LMS of via een link. Het beleid schrijven we niet, en we beloven geen compliance."
    vraag:
      id: opdrachtgever-afspraken
      vraag: "Hebben jullie al afspraken over AI-gebruik?"
      veld: "AI-afspraken"
      antwoorden:
        - waarde: ja
          label: "Ja, die liggen vast"
          sub: "Medewerkers kunnen ze nalezen"
          kop: "Een versie op maat laat ze toepassen"
          reactie: "Bij elke keuze staat wat jullie afspraken zeggen. Jullie leveren ze aan; het beleid schrijven wij niet."
          stap: { label: "Lees hoe een versie op maat werkt", href: "#faq-op-maat" }
          formulier: "Vertel voor welke groep de training is en wanneer."
        - waarde: bezig
          label: "Daar werken we aan"
          sub: "Er ligt een concept"
          kop: "In de workshop hoor je waar mensen tegenaan lopen"
          reactie: "AI Wijzer zoals hij is, kan daar nu al naast. Een versie op maat volgt als de afspraken vastliggen."
          stap: { label: "Lees welke twee vormen er zijn", href: "#faq-afnemen" }
          formulier: "Vertel wanneer jullie de afspraken verwachten."
        - waarde: nee
          label: "Nog niet"
          sub: "Iedereen doet wat hem verstandig lijkt"
          kop: "AI Wijzer werkt ook zoals hij is"
          reactie: "Algemene afspraken bij het fictieve Northfield: wat deel je, wanneer controleer je het antwoord, wanneer vraag je na. Een versie op maat kan later."
          stap: { label: "Ga naar de demo", href: "#probeer" }
          formulier: "Vertel om hoeveel medewerkers het gaat."

probeer:
  type: dilemma
  titel: "Eén keuze, zoals je deelnemers die krijgen"
  lead: "Kies zelf, en lees wat je er in een zaal mee doet. Daaronder speel je de hele demo: een stripverhaal over Joris, met AI Wijzer erin."
  dilemma:
    id: dilemma-ai-offerte
    veld: "Dilemma"
    situatie: "Een leverancier heeft een offerte gestuurd: twaalf pagina's met prijzen en voorwaarden. Over een uur wil je leidinggevende een samenvatting. Een AI-chatbot maakt die in een minuut."
    vraag: "Wat doe je?"
    antwoorden:
      - waarde: hele-offerte
        label: "Ik upload de hele offerte"
        kop: "Snel klaar, en de offerte ligt bij een ander"
        gevolg: "Na een minuut heb je je samenvatting. De prijzen en voorwaarden van je leverancier staan nu bij een AI-dienst."
        reactie: "Of dat mag, hangt af van de tool en van de afspraken in de organisatie. In de zaal is dit een goede eerste vraag: wie heeft dit weleens gedaan?"
      - waarde: training-uit
        label: "Ik zet eerst modeltraining uit en upload hem dan"
        kop: "Niet trainen is iets anders dan niet bewaren"
        gevolg: "Je zet de schakelaar om en uploadt de offerte. Of de dienst het bestand bewaart, heb je niet bekeken."
        reactie: "Over dat verschil gaat missie&nbsp;2 van de demo. Kiest een deel van je groep dit, dan weet je waar je uitleg begint."
      - waarde: zonder-prijzen
        label: "Ik laat de prijzen weg en upload de rest"
        kop: "Minder gedeeld. Wat staat er nog in?"
        gevolg: "Je haalt de prijstabel eruit en uploadt de rest."
        reactie: "Voorwaarden, namen en contactgegevens zijn vaak ook vertrouwelijk. Dat is de vraag voor je groep."
      - waarde: navragen
        label: "Ik vraag eerst na welke tool hiervoor mag"
        kop: "Het uur loopt"
        gevolg: "Je stuurt een bericht aan IT. Twintig minuten later is er nog geen antwoord."
        reactie: "Bij de ene organisatie staat het antwoord in de afspraken, bij de andere weet niemand het. Welke van de twee het is, hoor je in de zaal."
    groep:
      titel: "Wat jij van je groep ziet"
      tekst: "Zo kiest een voorbeeldgroep van elf deelnemers, en jij. Speelt je groep via Prepo of het LMS, dan zie je dit per situatie."
      aantallen: { hele-offerte: 3, training-uit: 5, zonder-prijzen: 2, navragen: 1 }
      advies: "De grootste groep zet modeltraining uit en uploadt dan toch. Daar begint je uitleg."
      meta: "Voorbeeldgegevens: elf deelnemers en jij."
  claim: "Dit dilemma is een voorbeeld en komt niet uit de demo. Kiest je groep verschillend, dan begint daar het gesprek. In Prepo of in het LMS zie je per situatie hoe de groep koos."
  demo:
    url: "https://learn.prepo.nl/demo-s/1knzJ0tBf7xENKTzVZQg7pCaKXx8qh3j/index.html"
    label: "Speel de demo Pas op met Privacy"
    terugkeer: true
    noot: "Een kort stripverhaal met de drie missies van AI Wijzer erin, zonder account. De demo opent in een nieuw tabblad; deze pagina blijft open."
  terug:
    titel: "Bedankt voor het spelen"
    lead: "Nu heb je gespeeld wat een deelnemer speelt. Wil je het in je volgende workshop of praktijkdag gebruiken? In een gesprek van een half uur kiezen we het moment en de vorm."

stappen:
  items:
    - titel: "Je speelt de demo zelf"
      tekst: "Een kort stripverhaal en drie missies bij het fictieve bedrijf Northfield. Je ziet wat deelnemers doen en welke feedback ze krijgen."
      beeld: { src: /assets/images/demo/bewust-met-ai-m3-beeld-3-eindcontrole.jpg, alt: "" }
    - titel: "We kiezen de vorm"
      tekst: "In een gesprek van een half uur: een groepslink voor AI Wijzer zoals hij is, of een versie op maat van je opdrachtgever. En het moment: vooraf, tijdens of erna."
      beeld: { src: /assets/images/demo/bewust-met-ai-m2-beeld-3-profiel-verbanden.jpg, alt: "" }
    - titel: "Je groep speelt, jij ziet hoe ze kozen"
      tekst: "Op telefoon of laptop, via een link in Prepo of in het LMS van je opdrachtgever. Per persoon zie je wie het deed, per situatie hoe de groep koos."
      beeld: { src: /assets/images/verhalen/prepo-overzicht.jpg, alt: "" }

bewijs:
  titel: "Wie we zijn en wat we eerder maakten"
  beeld: { src: /assets/images/verhalen/basis-koeltechniek-video-poster.jpg, alt: "Titelbeeld van Basis Koeltechniek" }
  alineas:
    - "&lt;Trainer of opdrachtgever&gt; zette AI Wijzer in bij &lt;workshop of praktijkdag&gt; met &lt;aantal&gt; deelnemers. &lt;resultaat, bijvoorbeeld wat de trainer vooraf zag en anders deed in de zaal&gt;."
    - "Preludens maakt MicroGames: online oefeningen waarin mensen keuzes uit hun werk maken en direct feedback krijgen. We werken samen met opleiders en trainers, en voor L&amp;D-teams en veiligheidsafdelingen."
    - "21CC Education kwam bij ons omdat hun praktijkdagen meer moesten opleveren, en daar hoorde een voorbereiding vooraf bij. Met hen en Studium maakten we <strong>CO Wijzer</strong>, waarmee monteurs vóór de praktijkdag oefenen. Met Climatools, 21CC Learning en Studium volgde <strong>Basis Koeltechniek</strong>: negen MicroGames voor installatiemonteurs."
    - "<strong>AI Wijzer</strong> is de demo op deze pagina: drie missies en tien opdrachten over wat je wel en niet met een AI-dienst deelt, in het Nederlands en het Engels. Samen met NNVO ontwikkelen we MicroGames over <strong>IT-veiligheid</strong>."

  citaat:
    tekst: "&lt;Citaat van een trainer over hoe de groep op de MicroGame reageerde.&gt;"
    bron: "&lt;Naam&gt;, &lt;trainer of facilitator&gt;, &lt;eigen bedrijf&gt;"
vragen:
  label: "Vragen van trainers over AI Wijzer"
  items:
    - { id: eigen-workshop, vraag: "Kan ik de demo in mijn eigen workshop gebruiken?", antwoord: "De demo op deze pagina is om zelf te proberen. Voor een groep krijg je een eigen link in Prepo; dan zie je ook hoe de groep koos." }
    - { id: mentimeter, vraag: "Ik gebruik al Mentimeter of Kahoot.", antwoord: "Die vragen deelnemers wat ze vinden of weten. In AI Wijzer doen ze het werk: een mail beoordelen, een prompt inkorten, kiezen of hij weg mag. Ze krijgen feedback op die keuze, en jij ziet waar het misging. Een poll ernaast blijft prima voor het gesprek." }
    - { id: moment, vraag: "Past het vóór, tijdens of na de sessie?", antwoord: "Alle drie kan. Vooraf zie je waar de groep staat. Tijdens de sessie is het een opstap naar het gesprek. Erna is het een vervolgopdracht voor als deelnemers weer aan het werk zijn." }
    - { id: afnemen, vraag: "Wat neem ik dan precies af?", antwoord: "Er zijn twee vormen. AI Wijzer zoals hij is, met een eigen link in Prepo voor jouw groep, zodat je ziet hoe de groep koos. Of een versie op maat van je opdrachtgever, met diens afspraken en situaties. Welke past, hangt af van je opdracht; dat bespreken we in het eerste gesprek." }
    - { id: kosten, vraag: "Wat kost het?", antwoord: "AI Wijzer met een eigen groepslink kost &lt;bedrag&gt; per &lt;deelnemer, groep of sessie&gt;, inclusief het groepsoverzicht in Prepo. Een versie op maat van je opdrachtgever begint bij &lt;bedrag&gt;, afhankelijk van het aantal situaties. &lt;Eventueel: trainers krijgen &lt;percentage&gt; korting als ze het in hun eigen aanbod opnemen.&gt;" }
    - { id: snelheid, vraag: "Hoe snel kan ik het gebruiken?", antwoord: "Een groepslink voor AI Wijzer staat binnen &lt;aantal&gt; werkdagen klaar. Een versie op maat duurt &lt;aantal&gt; weken, met &lt;aantal&gt; testrondes. Staat je workshop al gepland, noem dan de datum, dan kijken we wat haalbaar is." }
    - { id: wie-betaalt, vraag: "Wie betaalt: ik of mijn opdrachtgever?", antwoord: "Dat verschilt per opdracht. Soms neemt een trainer het op in zijn eigen programma, soms neemt de opdrachtgever het af voor zijn medewerkers. Dat bespreken we in het eerste gesprek." }
    - { id: op-maat, vraag: "Kan het op maat van mijn opdrachtgever?", antwoord: "Ja. In de demo werk je bij het fictieve Northfield. In een versie op maat staan de afspraken, de toegestane tools en de situaties van die organisatie. De organisatie levert de afspraken aan; het beleid schrijven wij niet." }
    - { id: groep-zien, vraag: "Zie ik wat de groep koos?", antwoord: "Ja, als je groep via Prepo of het LMS van je opdrachtgever speelt: per persoon wie het deed, en per situatie hoe de groep koos. Via de openbare demolink op deze pagina zie je dat niet." }
    - { id: laptop, vraag: "Hebben deelnemers een laptop nodig?", antwoord: "Nee. Het draait in de browser, op laptop of telefoon. Deelnemers installeren niets; ze hebben alleen de link nodig." }
    - { id: begin, vraag: "Waar begin je mee?", antwoord: "Met de demo. Daarna met één sessie die al gepland staat: één groep, één moment in je programma. Dan zie je hoe deelnemers reageren voordat je het vaker gebruikt." }

afspraak:
  titel: "Bespreek je workshop of praktijkdag"
  lead: "Een half uur, online. We kijken naar je programma, kiezen het moment en de vorm, en je krijgt daarna een voorstel."

formulier:
  titel: "Of stuur ons een bericht"
  lead: "Vertel welke workshop of praktijkdag je geeft, voor wie, en of er al een datum staat."
  noot: "Je krijgt binnen één werkdag een persoonlijk antwoord, met een voorstel voor een gesprek. Liever zelf bellen? 015 202 404 7"
