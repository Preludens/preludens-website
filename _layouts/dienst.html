---
layout: default
---
{% include locale.html %}
<section class="page-hero">
  <div class="container page-hero-inner">
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="play-blog-lead">{{ page.summary }}</p>
    {% endif %}
  </div>
</section>

<article class="section play-blog-article">
  <div class="container play-blog-detail">
    <div class="prose play-blog-body">
      {{ content }}
    </div>
    <p><a class="btn btn-secondary" href="{{ t.nav_paths.verhalen | relative_url }}">{{ t.verhalen.all_inspiration }}</a></p>
  </div>
</article>
