title: Preludens
tagline: Find the Game
description: >-
  Preludens bereidt teams voor op de toekomst met storytelling,
  MicroGames en interactieve leerervaringen.
# Het eigen domein, niet de github.io-URL: jekyll-seo-tag bouwt hiermee de
# canonical en og:url, jekyll-sitemap de <loc>'s en jekyll-feed de feed-links.
# Stond op https://preludens.github.io, waardoor de hele site en de sitemap
# naar GitHub Pages verwezen in plaats van naar preludens.nl. De deploy-workflow
# zet baseurl zelf leeg bij een custom domain (zie .github/workflows/pages.yml).
url: "https://preludens.nl"
baseurl: "/preludens-website"
# Canoniek productie-domein (via CNAME). Gebruikt voor structured data, og:image
# en robots/sitemap, zodat AI-engines en social previews het juiste domein zien.
prod_url: "https://preludens.nl"
lang: nl
email: info@preludens.nl
logo: /assets/images/logo/preludens-logo.png

languages: ["nl", "en"]
default_lang: "nl"
exclude_from_localization:
  - assets
  - admin
  - cloudflare
  - sitemap.xml
  - CNAME
  - .gitignore
  - .github
  - .cursor
lang_from_path: true
parallel_localization: true

permalink: pretty

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed
  sourcemap: never

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - node_modules
  - cloudflare
  # Interne documentatie. design.MD heeft front matter, dus Jekyll maakte er
  # een pagina van (/design/ en /en/design/); de andere twee werden als los
  # bestand meegekopieerd. Alle drie stonden publiek op preludens.nl.
  - design.MD
  - AGENTS.md
  - content-structuur-en-copy.md

  # Werkmap met ontwerpvarianten om naast elkaar te bekijken. Deze twaalf
  # bestanden stonden publiek op preludens.nl en in de sitemap, zonder
  # noindex. Het is statische HTML zonder Liquid die relatief naar
  # preview.css wijst, dus je opent ze net zo goed rechtstreeks vanaf schijf;
  # door Jekyll hoeven ze niet.
  - preview

plugins:
  - jekyll-polyglot
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  verhalen:
    output: true
    permalink: /verhalen/:name/
  play_blog:
    output: true
    permalink: /play/blog/:name/
  diensten:
    output: true
    permalink: /diensten/:name/

defaults:
  - scope:
      path: ""
    values:
      image: https://preludens.nl/assets/images/og/preludens-og.jpg
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
  - scope:
      path: ""
      type: "verhalen"
    values:
      layout: verhaal
  - scope:
      path: ""
      type: "play_blog"
    values:
      layout: play-blog
  - scope:
      path: ""
      type: "diensten"
    values:
      layout: dienst

social:
  email: info@preludens.nl
