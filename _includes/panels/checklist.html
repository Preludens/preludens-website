{% comment %}
  Korte checklist voor een smalle kolom, opgebouwd uit panels/check.html.
  Pass: items, label, columns ("two" voor twee kolommen in een volle band).
{% endcomment %}
<ul class="sp-checklist{% if include.columns %} sp-checklist--{{ include.columns }}{% endif %}" aria-label="{{ include.label }}">
  {{ include.items }}
</ul>
