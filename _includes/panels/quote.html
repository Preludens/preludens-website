{% comment %}
  Citaat als eigen vorm. Pass: text, cite.

  Zonder variant is het de brede, gecentreerde vorm die ook op de homepage
  staat. `variant="aside"` zet het citaat als smalle pull-quote naast lopende
  tekst: links uitgelijnd, met een gouden kantlijn.
{% endcomment %}
<figure class="sp-quote{% if include.variant %} sp-quote--{{ include.variant }}{% endif %}">
  <blockquote>{{ include.text }}</blockquote>
  {% if include.cite %}<cite>{{ include.cite }}</cite>{% endif %}
</figure>
